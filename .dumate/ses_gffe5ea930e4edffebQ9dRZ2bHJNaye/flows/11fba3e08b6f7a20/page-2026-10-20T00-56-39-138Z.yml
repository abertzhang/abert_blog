          - heading "Flutter 渲染管线：从 Widget 到 Layer 的完整链路" [level=1] [ref=e22]
          - paragraph [ref=e23]:
            - generic [ref=e24]: 作者 abert
            - generic [ref=e25]: ·
            - time [ref=e26]: 2026-08-12
            - generic [ref=e27]: ·
            - generic [ref=e28]: Flutter
            - generic [ref=e29]: ·
            - generic [ref=e30]: 约 9 分钟阅读
        - generic [ref=e31]:
          - paragraph [ref=e32]: 很多人对 Flutter 的性能印象来自一句话：Widget 很轻，重建不贵。这句话是对的，但它只覆盖了整条链路的第一段。真正决定一次更新要花多少时间的，往往是你没有显式写过的那几层。
          - heading "一次更新经历了什么" [level=2] [ref=e33]
          - paragraph [ref=e34]:
            - text: 从调用
            - code [ref=e35]: setState
            - text: 到屏幕上出现新像素，中间至少经过四个阶段：构建（Build）、布局（Layout）、绘制（Paint）与合成（Composite）。每个阶段都有自己的失效范围，理解这个范围，才能判断代价落在哪里。
          - generic [ref=e36]:
            - generic [ref=e37]: dart
            - code [ref=e39]: "class ArticleListView extends ConsumerWidget { const ArticleListView({super.key}); @override Widget build(BuildContext context, WidgetRef ref) { final articles = ref.watch(articleListProvider); return articles.when( data: (items) => ListView.builder( itemCount: items.length, itemBuilder: (context, index) => ArticleTile(article: items[index]), ), loading: () => const Center(child: CircularProgressIndicator()), error: (error, stack) => ErrorView(error: error), ); } }"
          - paragraph [ref=e40]:
            - text: 上面这段代码本身没有问题，但
            - code [ref=e41]: ref.watch
            - text: 的位置决定了整棵子树的失效范围：把订阅放在列表项之外，任何一条数据变化都会重建整个列表容器。
          - heading "为什么代价常常不在 setState" [level=2] [ref=e42]
          - paragraph [ref=e43]: 构建阶段的成本通常是可控的，因为 Widget 只是不可变的配置对象。真正昂贵的是布局与绘制：它们要处理真实的几何信息与像素。
          - heading "布局阶段的真实开销" [level=3] [ref=e44]
          - paragraph [ref=e45]: 当一棵子树的约束发生变化，布局会沿着这棵子树自顶向下重新计算。常见的放大器有三个：
          - list [ref=e46]:
            - listitem [ref=e47]: 在滚动容器里使用无界高度的布局组件，导致每帧重新测量；
            - listitem [ref=e48]: 把频繁变化的状态订阅放在靠近根节点的位置，放大失效范围；
            - listitem [ref=e49]: 在同一帧里连续触发多次状态更新，却没有合并成一次。
          - blockquote [ref=e50]:
            - paragraph [ref=e51]: 判断性能问题的最快方式，不是读代码找可疑点，而是先让 DevTools 告诉你时间花在哪个阶段，再回到代码里找对应的那行。
          - heading "把结论变成可执行的检查" [level=2] [ref=e52]
          - paragraph [ref=e53]: 把上面的分析整理成一套可以在每次提交前跑一遍的动作：
          - generic [ref=e54]:
            - generic [ref=e55]: shell
            - code [ref=e57]: flutter run --profile --trace-startup flutter build apk --split-debug-info=build/symbols
          - paragraph [ref=e58]: 如果时间线里布局与绘制占比明显高于构建，说明问题在几何而非状态；反之则应优先检查订阅粒度与状态合并。两种情况的优化方向完全不同，先分清楚再动手，能省掉大量无效重构。
